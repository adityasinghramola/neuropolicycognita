name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the site address
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [ -f public/CNAME ]; then
            echo "SITE=https://$(tr -d '[:space:]' < public/CNAME)" >> "$GITHUB_ENV"
            echo "BASE=/" >> "$GITHUB_ENV"
          elif [ "$REPO" = "$OWNER.github.io" ]; then
            echo "SITE=https://$OWNER.github.io" >> "$GITHUB_ENV"
            echo "BASE=/" >> "$GITHUB_ENV"
          else
            echo "SITE=https://$OWNER.github.io" >> "$GITHUB_ENV"
            echo "BASE=/$REPO" >> "$GITHUB_ENV"
          fi

      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
